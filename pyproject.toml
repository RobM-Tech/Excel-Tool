[project]
name = "excel-tool"
version = "0.1.0"
description = "Reusable tool to reconcile requirements between DOORS exports and rubric spreadsheets, identifying missing items, and duplicate object text."
readme = "README.md"
authors = [
    { name = "RobM-Tech", email = "robert.mathieu.tech@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
excel-tool = "excel_tool:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
